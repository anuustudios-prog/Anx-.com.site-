<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | ANX Studio</title><link rel="stylesheet" href="../assets/css/auth-register.css"></head><body><main class="auth-wrap"><a class="brand" href="../index.html">ANX<span> STUDIO</span></a><section class="panel"><p class="eyebrow">JOIN ANX STUDIO</p><h1>Create your account.</h1><p class="sub">Set up your client workspace in a minute.</p><form id="auth-form" data-mode="register"><label>Full name</label><input name="name" autocomplete="name" required maxlength="100"><label>Email</label><input name="email" type="email" autocomplete="email" required><label>Password (at least 6 characters)</label><input name="password" type="password" autocomplete="new-password" minlength="6" required><button type="submit">Create account</button><p id="message" class="message"></p></form><p class="foot">Already registered? <a href="login.html">Sign in</a></p></section></main><script type="module" src="../assets/js/auth.js"></script></body></html>
